<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  <!--CSS Stylesheet-->
  <link rel="stylesheet" href="style.css">
  <!--Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>

  <main>
    <div class="container">
      <article class="container_profile">
        <div class="profile_pic">
           <img class="pic" src="/assets/images/avatar-jessica.jpeg" alt="Profile Pic of Jessica">
        </div>
        <div class="profile_details">
          <h2>Jessica Randall</h2>
          <p>London, United Kingdom</p>
        </div>
        <div class="profile_info">
          <p>
            "Front-end developer and avid reader."
          </p>
        </div>
      </article>

      <article class="container_links">
        <div class="link_child">
            <a href="https://github.com/" class="link" target="_blank">
              <button>GitHub</button>  
            </a>
            <a href="https://www.frontendmentor.io/" class="link" target="_blank">
              <button>Frontend Mentor</button>  
            </a>
            <a href="https://www.linkedin.com/" class="link" target="_blank">
              <button>LinkedIn</button>  
            </a>
            <a href="https://x.com" class="link" target="_blank">
              <button>Twitter</button>  
            </a>
            <a href="https://www.instagram.com" class="link" target="_blank">
              <button>Instagram</button>  
            </a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
